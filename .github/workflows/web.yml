name: web-suite

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-suite
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      report: ${{ steps.allure.outcome }}
    env:
      ESUITE_EMAIL: ${{ secrets.ESUITE_EMAIL }}
      ESUITE_PASSWORD: ${{ secrets.ESUITE_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: without it data falls back to Faker
    steps:
      - name: Check required secrets
        id: secrets
        run: |
          if [ -z "$ESUITE_EMAIL" ] || [ -z "$ESUITE_PASSWORD" ]; then
            echo "::error::Set the repository secrets ESUITE_EMAIL and ESUITE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # One pytest call: every call cleans allure-results, so a second call would erase the first's results.
      - name: Unit tests + web suite (headless)
        run: pytest tests/unit web

      - name: AI failure triage (proposals only)
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        run: python -m ai.triage --reproduce 1

      - name: Safety-net cleanup of companies left by a crashed run
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        run: python -m web.company_lifecycle --cleanup

      - uses: actions/setup-java@v5
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Allure report
        id: allure
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        run: |
          npm install -g allure-commandline
          allure generate allure-results -o allure-report --clean

      - name: Upload reports
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            allure-report
            reports/triage_report.md

      - name: Prepare Pages artifact
        if: ${{ !cancelled() && steps.allure.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  publish:
    needs: web
    if: ${{ !cancelled() && needs.web.outputs.report == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
